<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Art Gallery</title>
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #222;
      color: white;
      padding: 15px 0;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
    }
    #gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    .art-piece {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .art-piece:hover {
      transform: scale(1.03);
    }
    iframe {
      border: none;
      display: block;
    }
    h3 {
      margin: 10px 0 5px;
      font-size: 1.1rem;
    }
    p {
      margin: 0 0 10px;
      font-size: 0.9rem;
      color: #666;
    }
    #loadingMessage {
      margin-top: 30px;
      font-size: 1.1rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 미디어 아트 갤러리</h1>
  </header>
  
  <div id="gallery"></div>
  <div id="loadingMessage">작품을 불러오는 중입니다...</div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sessionCode = urlParams.get('class') || '';
    const frameWidth = parseInt(urlParams.get('width')) || 400;
    const frameHeight = parseInt(urlParams.get('height')) || 400;
    const sheetUrl = urlParams.get('sheet');
    const gallery = document.getElementById('gallery');
    const loadingMessage = document.getElementById('loadingMessage');

    if (!sheetUrl) {
      loadingMessage.innerHTML = '❌ Google Sheet CSV URL이 지정되지 않았습니다.';
    } else {
      loadCSV(sheetUrl);
    }

    // ✅ CSV 불러오기
    async function loadCSV(url) {
      try {
        const response = await fetch(url);
        const csvText = await response.text();
        const data = parseCSV(csvText);
        renderGallery(data);
      } catch (error) {
        console.error('CSV 로드 실패:', error);
        loadingMessage.innerHTML = '⚠️ CSV 데이터를 불러오지 못했습니다.';
      }
    }

    // ✅ CSV를 객체 배열로 변환
    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n').map(line => line.split(','));
      const headers = lines[0].map(h => h.replace(/"/g, '').trim());
      const rows = lines.slice(1).map(values => {
        const entry = {};
        headers.forEach((header, i) => {
          entry[header] = (values[i] || '').replace(/"/g, '').trim();
        });
        return entry;
      });
      return rows;
    }

    // ✅ 갤러리 렌더링
    function renderGallery(data) {
      // B열(class 코드) 기준 필터
      const filtered = data.filter(row => row['B'] && row['B'].trim() === sessionCode);

      if (filtered.length === 0) {
        loadingMessage.innerHTML = '⚠️ 표시할 작품이 없습니다. (class 코드 확인)';
        return;
      }

      loadingMessage.remove();
      console.log(`✅ ${filtered.length}개의 작품 로드 완료`);

      filtered.forEach(row => {
        const artPiece = document.createElement('div');
        artPiece.className = 'art-piece';
        artPiece.style.width = `${frameWidth}px`;

        const p5jsUrl = row['F'] ? row['F'].trim() : '';
        if (!p5jsUrl.startsWith('http')) {
          console.warn(`[건너뜀] 잘못된 URL: ${row['C']}`);
          return;
        }

        const title = row['C'] || '제목 없음';
        const author = row['D'] || '작가 미상';
        const desc = (row['G'] || '').substring(0, 60);

        artPiece.innerHTML = `
          <iframe
            src="${p5jsUrl}"
            width="${frameWidth}"
            height="${frameHeight}"
            loading="lazy"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
          <h3>${title}</h3>
          <p>👤 ${author} | ${desc}${row['G'] && row['G'].length > 60 ? '...' : ''}</p>
        `;
        gallery.appendChild(artPiece);
      });
    }
  </script>
</body>
</html>
