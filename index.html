<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미디어 아트 갤러리</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background: #fafafa;
      color: #333;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 1rem;
    }
    iframe {
      width: 100%;
      border: none;
      border-radius: 8px;
    }
    .title {
      font-weight: 600;
      margin: 0.5rem 0 0.2rem;
    }
    .author {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.6rem;
    }
    .description {
      font-size: 0.95rem;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>🎨 미디어 아트 갤러리</h1>
  <div class="gallery" id="gallery"></div>

  <script>
    // URL 파라미터 가져오기
    const params = new URLSearchParams(window.location.search);
    const sheetUrl = params.get("sheet");
    const width = params.get("width") || 400;
    const height = params.get("height") || 400;
    const classCode = params.get("class") || "";

    document.title = `미디어 아트 갤러리 - ${classCode}`;

    // CSV 불러오기
    async function loadCSV(url) {
      const res = await fetch(url);
      const text = await res.text();
      const rows = text.split("\n").map(r => r.split(","));
      const headers = rows[0].map(h => h.trim());
      const data = rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((key, i) => obj[key] = row[i]);
        return obj;
      });
      return data;
    }

    function createCard(item) {
      const card = document.createElement("div");
      card.className = "card";
      const iframeCode = decodeURIComponent(item.iframe_code || "");
      const iframeHTML = iframeCode.includes("<iframe")
        ? iframeCode
        : `<iframe src="${iframeCode}" width="${width}" height="${height}"></iframe>`;

      card.innerHTML = `
        ${iframeHTML}
        <div class="title">${item.title || "무제"}</div>
        <div class="author">by ${item.author || "익명"}</div>
        <div class="description">${item.description || ""}</div>
      `;
      return card;
    }

    async function renderGallery() {
      if (!sheetUrl) {
        document.getElementById("gallery").innerHTML =
          "<p>⚠️ 구글 시트 CSV 주소(sheet=)가 없습니다.</p>";
        return;
      }
      const data = await loadCSV(sheetUrl);
      const gallery = document.getElementById("gallery");
      data.forEach(item => {
        if (item.iframe_code?.trim()) {
          gallery.appendChild(createCard(item));
        }
      });
    }

    renderGallery();
  </script>
</body>
</html>
