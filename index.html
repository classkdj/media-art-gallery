<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Art Gallery</title>
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    iframe {
      border: none;
      width: 100%;
      height: 400px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .info {
      padding: 10px 15px;
    }
    .title {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 4px;
    }
    .author {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    .description {
      color: #444;
      font-size: 0.95em;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>🎨 Media Art Gallery</h1>
  <div id="gallery"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const sheetUrl = urlParams.get("sheet");
    const width = urlParams.get("width") || 400;
    const height = urlParams.get("height") || 400;

    async function loadCSV(url) {
      const response = await fetch(url);
      const text = await response.text();
      const [header, ...rows] = text.trim().split("\n");
      const keys = header.split(",");
      return rows.map(row => {
        const values = row.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(v => v.replace(/^"|"$/g, ""));
        const obj = {};
        keys.forEach((key, i) => obj[key.trim()] = values[i] || "");
        return obj;
      });
    }

    function createCard(item) {
      const card = document.createElement("div");
      card.className = "card";

      const iframe = document.createElement("iframe");
      iframe.width = width;
      iframe.height = height;
      iframe.loading = "lazy";

      // iframe 코드에서 src 추출
      const iframeCode = decodeURIComponent(item.iframe_code || "");
      const srcMatch = iframeCode.match(/src=["']([^"']+)["']/);
      let src = srcMatch ? srcMatch[1] : iframeCode;

      // 🔧 링크 수정 부분
      src = src
        .replace("/embed/", "/full/")
        .replace("/sketches/", "/full/");

      iframe.dataset.src = src;

      card.appendChild(iframe);

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `
        <div class="title">${item.title || "무제"}</div>
        <div class="author">by ${item.author || "익명"}</div>
        <div class="description">${item.description || ""}</div>
      `;
      card.appendChild(info);

      return card;
    }

    async function renderGallery() {
      const data = await loadCSV(sheetUrl);
      const gallery = document.getElementById("gallery");

      data.forEach(item => {
        if (item.iframe_code?.trim()) {
          const card = createCard(item);
          gallery.appendChild(card);
        }
      });

      // Lazy Load 설정
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const iframe = entry.target.querySelector("iframe");
            if (iframe && iframe.dataset.src && !iframe.src) {
              iframe.src = iframe.dataset.src;
              iframe.onload = () => iframe.style.opacity = "1";
            }
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll(".card").forEach(card => observer.observe(card));
    }

    renderGallery();
  </script>
</body>
</html>
